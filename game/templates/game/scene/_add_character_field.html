{% comment %}The characters this viewer may add (AddCharForm's choices). Inputs: add_characters, oob.{% endcomment %}<span id="add-char-field"{% if oob %} hx-swap-oob="true"{% endif %}>
    <select id="character-to-add" name="character_to_add" class="form-control d-inline-block" style="width: auto;" aria-label="Add character">
        <option value="">Add Character</option>
        {% for char in add_characters %}<option value="{{ char.pk }}">{{ char.name }}</option>{% endfor %}
    </select>
</span>
