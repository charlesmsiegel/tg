{% extends "items/core/item/detail.html" %}
{% load tl %}
{% block additional_stats %}
    <section class="tl-section tl-span-6" id="properties">
        <div class="tl-section__head">
            <span class="tl-section__num"></span>
            <h2 class="tl-section__title">Properties</h2>
        </div>
        <div class="tl-section__body tl-stack">
            {% trait "Level" object.level %}
            <div class="tl-kv"><span>Background cost</span><span class="tl-kv__v">{{ object.background_cost }}</span></div>
            <div class="tl-kv"><span>Rarity</span><span class="tl-kv__v">{{ object.get_rarity_display }}</span></div>
            <div class="tl-kv"><span>Pathos cost</span><span class="tl-kv__v">{{ object.pathos_cost }}</span></div>
        </div>
    </section>
{% endblock additional_stats %}
