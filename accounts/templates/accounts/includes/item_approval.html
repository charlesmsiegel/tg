{% if items_to_approve %}
    <section class="tl-section tl-queue tl-queue--sm"
             id="item-approval-section"
             aria-labelledby="item-approval-title">
        <div class="tl-section__head">
            <h2 class="tl-section__title" id="item-approval-title">Items to approve</h2>
            <span class="tl-queue__count">{{ items_to_approve|length }}</span>
        </div>
        <div class="tl-section__body">
            {% for obj in items_to_approve %}
                {% include "accounts/includes/approval_row.html" with object_type="item" %}
            {% endfor %}
        </div>
    </section>
{% endif %}
