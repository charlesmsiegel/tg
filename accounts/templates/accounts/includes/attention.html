{% load tl %}
{% if scenes_waiting %}
    <section class="tl-section tl-queue tl-queue--sm"
             id="attention-section"
             aria-labelledby="attention-title">
        <div class="tl-section__head">
            <h2 class="tl-section__title" id="attention-title">Scenes needing attention</h2>
            <span class="tl-queue__count">{{ scenes_waiting|length }}</span>
        </div>
        <div class="tl-section__body">
            {% for scene in scenes_waiting %}
                <div class="tl-scenerow" data-gameline="{{ scene|gameline_code }}">
                    <span class="tl-scenerow__name"><a href="{{ scene.get_absolute_url }}">{{ scene.name }}</a></span>
                    <span class="tl-scenerow__when is-live">{{ scene.st_message }}</span>
                </div>
            {% endfor %}
        </div>
    </section>
{% endif %}
