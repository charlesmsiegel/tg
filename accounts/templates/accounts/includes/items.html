{% if items %}
    <section class="tl-block tl-block--tight" id="items-section">
        <div class="tl-grouphead">
            <h2 class="tl-grouphead__name">Items</h2>
            <span class="tl-grouphead__rule"></span>
            <span class="tl-grouphead__count">{{ items|length }}</span>
        </div>
        <div class="tl-grid">
            {% for item in items %}
                {% include "accounts/includes/owned_tile.html" with obj=item %}
            {% endfor %}
        </div>
    </section>
{% endif %}
