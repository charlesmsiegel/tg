{% if locations_to_approve %}
    <section class="tl-section tl-queue tl-queue--sm"
             id="location-approval-section"
             aria-labelledby="location-approval-title">
        <div class="tl-section__head">
            <h2 class="tl-section__title" id="location-approval-title">Locations to approve</h2>
            <span class="tl-queue__count">{{ locations_to_approve|length }}</span>
        </div>
        <div class="tl-section__body">
            {% for obj in locations_to_approve %}
                {% include "accounts/includes/approval_row.html" with object_type="location" %}
            {% endfor %}
        </div>
    </section>
{% endif %}
