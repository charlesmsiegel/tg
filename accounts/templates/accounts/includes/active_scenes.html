{% load tl %}
{% if unread_scenes %}
    <section class="tl-section tl-queue tl-queue--sm"
             id="unread-scenes-section"
             aria-labelledby="unread-scenes-title">
        <div class="tl-section__head">
            <h2 class="tl-section__title" id="unread-scenes-title">Unread scenes</h2>
            <span class="tl-queue__count">{{ unread_scenes|length }}</span>
        </div>
        <div class="tl-section__body">
            {% for scene in unread_scenes %}
                <div class="tl-scenerow" data-gameline="{{ scene|gameline_code }}">
                    <span class="tl-scenerow__name"><a href="{{ scene.get_absolute_url }}">{{ scene.name }}</a></span>
                    <form action="{% url 'accounts:mark_scene_read' scene_pk=scene.pk %}" method="post">
                        {% csrf_token %}
                        <button type="submit" class="tl-btn tl-btn--ghost tl-btn--sm">Mark read</button>
                    </form>
                </div>
            {% endfor %}
        </div>
    </section>
{% endif %}
