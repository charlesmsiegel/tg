{% if characters_to_approve %}
    <section class="tl-section tl-queue"
             id="character-approval-section"
             aria-labelledby="character-approval-title">
        <div class="tl-section__head">
            <h2 class="tl-section__title" id="character-approval-title">Characters to approve</h2>
            <span class="tl-queue__count">{{ characters_to_approve|length }}</span>
        </div>
        <div class="tl-section__body">
            {% for obj in characters_to_approve %}
                {% include "accounts/includes/approval_row.html" with object_type="character" %}
            {% endfor %}
        </div>
    </section>
{% endif %}
