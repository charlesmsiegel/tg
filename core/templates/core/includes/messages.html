{% load sanitize_text %}
{% comment %} Always rendered so htmx fragments can replace it out of band
   (hx-swap-oob) and so screen readers announce new notices. {% endcomment %}
<div id="tg-messages" class="container{% if messages %} mt-3{% endif %}" aria-live="polite"{% if oob %} hx-swap-oob="true"{% endif %}>
    {% for message in messages %}
        <div class="tg-message {{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message|sanitize_html }}
            <button type="button" class="close" data-dismiss="alert" aria-label="Close" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 1.5rem; line-height: 1; opacity: 0.5; cursor: pointer;">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
    {% endfor %}
</div>
