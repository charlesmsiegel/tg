[tool.black]
line-length = 100
target-version = ['py310']
exclude = '''
/(
    \.conda
    | \.git
    | \.vscode
    | migrations
    | __pycache__
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".conda",
    ".git",
    ".vscode",
    "migrations",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
# Data scripts import other data scripts mid-file on purpose: each import runs that
# script, so the order is the load order.
"populate_db/**" = ["E402"]