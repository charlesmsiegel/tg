{% if widget.alpine %}<span class="tg-dots-control" x-data="tgDots" data-min="{{ widget.minimum }}" data-max="{{ widget.maximum }}">{% include "django/forms/widgets/input.html" %}<span class="tg-dot-buttons" role="group" aria-label="{{ widget.label }}" x-cloak>{% for dot in widget.values %}<button type="button" class="tg-dot" data-value="{{ dot }}" aria-label="{{ widget.label }} {{ dot }}" x-bind:aria-pressed="pressed({{ dot }})" x-bind:class="{ 'is-filled': filled({{ dot }}) }" x-on:click="pick({{ dot }})"></button>{% endfor %}</span></span>{% else %}<span class="tg-dots-control" data-dot-rating data-min="{{ widget.minimum }}" data-max="{{ widget.maximum }}">{% include "django/forms/widgets/input.html" %}<span class="tg-dot-buttons" role="group" aria-label="{{ widget.label }}" hidden>{% for dot in widget.values %}<button type="button" class="tg-dot{% if dot <= widget.current %} is-filled{% endif %}" data-value="{{ dot }}" aria-label="{{ widget.label }} {{ dot }}" aria-pressed="{% if dot == widget.current %}true{% else %}false{% endif %}"></button>{% endfor %}</span></span>{% endif %}
