<span class="tg-dots-control" x-data="tgDots" data-min="{{ widget.minimum }}" data-max="{{ widget.maximum }}">{% include "django/forms/widgets/input.html" %}<span class="tg-dot-buttons" role="group" aria-label="{{ widget.label }}" x-cloak>{% for dot in widget.values %}<button type="button" class="tg-dot" data-value="{{ dot }}" aria-label="{{ widget.label }} {{ dot }}" x-bind:aria-pressed="pressed({{ dot }})" x-bind:class="{ 'is-filled': filled({{ dot }}) }" x-on:click="pick({{ dot }})"></button>{% endfor %}</span></span>
