<div class="row">
    <div class="col-sm">
        <div class="tg-card">
            <div class="tg-card-header">
                <h5 class="tg-card-title {{ object.get_heading }}">Disciplines</h5>
                {% for rule in allocation_rules %}
                    <p class="tg-card-subtitle">Spend {{ rule.total }} dots on Clan Disciplines</p>
                {% endfor %}
            </div>
            <div class="tg-card-body">
                {{ form.as_p }}
                {% include "characters/core/chargen/pool.html" %}
            </div>
        </div>
    </div>
</div>
