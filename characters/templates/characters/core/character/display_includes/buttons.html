{% if can_retire or can_decease %}
    <div class="tl-actions">
        {% if can_retire %}
            <form method="post" action="{% url 'characters:retire' object.pk %}">
                {% csrf_token %}
                <button type="submit" class="tl-btn tl-btn--ghost">Mark retired</button>
            </form>
        {% endif %}
        {% if can_decease %}
            <form method="post" action="{% url 'characters:decease' object.pk %}">
                {% csrf_token %}
                <button type="submit" class="tl-btn tl-btn--danger">Mark deceased</button>
            </form>
        {% endif %}
    </div>
{% endif %}
