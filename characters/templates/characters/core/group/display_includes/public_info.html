{% load sanitize_text %}
{% comment %}Public info section of a group page; hidden when empty.{% endcomment %}
{% if object.public_info %}
    <section class="tl-section" id="public-info">
        <div class="tl-section__head">
            <span class="tl-section__num"></span>
            <h2 class="tl-section__title">Public info</h2>
        </div>
        <div class="tl-section__body tl-prose">{{ object.public_info|sanitize_html|linebreaks }}</div>
    </section>
{% endif %}
