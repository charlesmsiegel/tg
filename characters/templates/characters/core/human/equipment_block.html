{% with items=object.get_items_owned %}
    {% if items %}
        <section class="tl-section tl-span-6" id="equipment">
            <div class="tl-section__head">
                <span class="tl-section__num"></span>
                <h2 class="tl-section__title">Equipment</h2>
            </div>
            <div class="tl-section__body tl-stack">
                {% for item in items %}
                    <div class="tl-kv">
                        <a href="{{ item.get_absolute_url }}">{{ item }}</a>
                        <span class="tl-kv__v tl-muted">{{ item.get_type }}</span>
                    </div>
                {% endfor %}
            </div>
        </section>
    {% endif %}
{% endwith %}
