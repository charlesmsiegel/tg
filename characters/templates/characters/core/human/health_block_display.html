<section class="tl-section {{ span|default:'tl-span-6' }}" id="health">
    <div class="tl-section__head">
        <span class="tl-section__num"></span>
        <h2 class="tl-section__title">Health</h2>
    </div>
    <div class="tl-section__body tl-healthlist">
        {% for name, penalty, level in object.get_health_table %}
            <div class="tl-health">
                <span class="tl-health__name">{{ name }}</span>
                {% if penalty and penalty != "-0" and penalty != "0" %}<span class="tl-health__pen">{{ penalty }}</span>{% endif %}
                <span class="tl-health__box{% if level == 'B' %} is-b{% elif level == 'L' %} is-l{% elif level == 'A' %} is-a{% endif %}"
                      role="img"
                      aria-label="{% if level == 'B' %}bashing{% elif level == 'L' %}lethal{% elif level == 'A' %}aggravated{% else %}undamaged{% endif %}"></span>
            </div>
        {% endfor %}
    </div>
</section>
