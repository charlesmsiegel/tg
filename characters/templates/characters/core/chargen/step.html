{% load widget_media %}
<form id="chargen-step"
      class="tl-chargen"
      method="post"
      action="{{ request.path }}"
      hx-post="{{ request.path }}"
      hx-target="this"
      hx-swap="outerHTML"
      hx-push-url="false"
      hx-disabled-elt="#chargen-step button[type='submit']"
      data-tg-expect="chargen-step"
      data-step="{{ step.key }}">
    {% csrf_token %}
    {% include "characters/core/chargen/step_body.html" %}
    {% if fragment %}{% page_media %}{% endif %}
</form>
