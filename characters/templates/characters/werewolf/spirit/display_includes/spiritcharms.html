{% comment %}Spirit Charms (--acc): name and Essence cost.{% endcomment %}
<section class="tl-section tl-section--power" id="charms">
    <div class="tl-section__head">
        <span class="tl-section__num"></span>
        <h2 class="tl-section__title">Charms</h2>
    </div>
    <div class="tl-section__body">
        {% with charms=object.charms.all %}
            {% if charms %}
                <table class="tl-table">
                    <thead>
                        <tr>
                            <th>Charm</th>
                            <th class="tl-num">Essence cost</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for charm in charms %}
                            <tr>
                                <td><a href="{{ charm.get_absolute_url }}">{{ charm.name }}</a></td>
                                <td class="tl-num">{{ charm.essence_cost }}</td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            {% else %}
                <p class="tl-muted">No charms.</p>
            {% endif %}
        {% endwith %}
    </div>
</section>
